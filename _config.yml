# ────── Author / Sidebar ──────
author:
  name       : "Subhankar Nag"
  avatar     : "/assets/images/iitb_dp_1.png"
  bio        : "Ph.D. Student, CSE<br>IIT Bombay"
  location   : "Mumbai, India"
  links:
    - label: "Email"
      icon : "fas fa-fw fa-envelope"
      url  : "mailto:subhankar@cse.iitb.ac.in"
    - label: "Website"
      icon : "fas fa-fw fa-globe"
      url  : "https://www.cse.iitb.ac.in/~subhankar"
    # - label: "GitHub"
    #   icon : "fab fa-fw fa-github"
    #   url  : "https://github.com/subhankarnag"
