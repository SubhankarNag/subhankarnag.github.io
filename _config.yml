  # Used by SEO plugins and JSON-LD generation
  github : "subhankarnag"

# ────── Global defaults ──────
defaults:
  - scope:
      path: ""
    values:
      author_profile: true
      layout: single

# ────── Skin ──────
minimal_mistakes_skin: "default"

# ────── Build ──────
markdown: kramdown
highlighter: rouge
permalink: /:categories/:title/
include:
  - _pages